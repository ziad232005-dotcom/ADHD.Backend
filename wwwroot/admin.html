<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAZID admin</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <style>
    body { font-family: system-ui, sans-serif; background: #f6f3ff; color: #2b2540; margin: 0; }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
    h1 { color: #6c4bd6; margin: 0 0 16px; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    input[type=password] { padding: 10px 12px; border: 1px solid #cfc6ee; border-radius: 10px; min-width: 220px; }
    button { padding: 10px 16px; border: 0; border-radius: 10px; background: #6c4bd6; color: #fff; cursor: pointer; font-size: 14px; }
    button.ghost { background: #fff; color: #6c4bd6; border: 1px solid #6c4bd6; }
    button.red { background: #c0392b; }
    button.on { background: #2b2540; }
    .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .card h2 { margin: 0 0 4px; font-size: 18px; }
    .muted { color: #756f8c; font-size: 13px; }
    .row { margin: 6px 0; line-height: 1.4; }
    .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .cert { max-width: 100%; margin-top: 10px; border-radius: 10px; border: 1px solid #e6e0fa; }
    #message { margin: 10px 0; color: #c0392b; }
  </style>
</head>
<body>
<main>
  <h1>MAZID admin: Shadow Teachers</h1>
  <div class="bar">
    <input id="password" type="password" placeholder="Admin password" autocomplete="current-password">
    <button id="load">Open</button>
  </div>
  <div class="bar" id="tabs" hidden>
    <button class="on" data-status="pending">Waiting</button>
    <button class="ghost" data-status="approved">Approved</button>
    <button class="ghost" data-status="rejected">Rejected</button>
  </div>
  <div id="message"></div>
  <div id="list"></div>
</main>
<script src="admin.js"></script>
</body>
</html>
